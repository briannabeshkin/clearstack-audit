# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1ac8b490b0db536181e65ed4ec217198"
name = "clearstack-audit"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_customers,read_products,read_shopify_payments_accounts,read_shopify_payments_payouts"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory GDPR/compliance webhooks — required for App Store submission.
  # These use `compliance_topics`, not `topics`: Shopify validates that only
  # the three privacy-compliance topics (customers/data_request,
  # customers/redact, shop/redact) go in this field, and registers them
  # through a separate mechanism from regular webhook topics even though
  # the topic strings themselves are unchanged (lowercase, slash-separated
  # — same as always, not uppercase/underscored).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
